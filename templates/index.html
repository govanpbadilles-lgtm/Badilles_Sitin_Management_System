<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCS | Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ── MODAL OVERLAY ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(8, 20, 50, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            animation: fadeOverlay .25s ease;
        }
        .modal.active { display: flex; }
        @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

        /* ── MODAL CARD ── */
        .modal-content {
            position: relative;
            width: 420px;
            max-width: 95vw;
            background: linear-gradient(145deg, #ffffff 0%, #f0f6ff 100%);
            border-radius: 24px;
            padding: 44px 40px 36px;
            box-shadow:
                0 30px 80px rgba(10, 40, 100, 0.22),
                0 0 0 1px rgba(255,255,255,0.9) inset;
            animation: slideUp .35s cubic-bezier(.22,.68,0,1.2);
            font-family: 'Outfit', sans-serif;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px) scale(.96); }
            to   { opacity: 1; transform: translateY(0)  scale(1); }
        }

        /* ── CLOSE BUTTON ── */
        .close-btn {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 22px;
            color: #8a9bb5;
            cursor: pointer;
            line-height: 1;
            transition: color .2s, transform .2s;
        }
        .close-btn:hover { color: #1b4f8a; transform: rotate(90deg); }

        /* ── HEADER SECTION ── */
        .modal-header-wrap {
            text-align: center;
            margin-bottom: 30px;
        }
        .modal-icon-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1b4f8a, #2e7de9);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 24px rgba(27,79,138,.30);
        }
        .modal-icon-ring i { color: #fff; font-size: 22px; }
        .modal-content h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #0d2b55;
            margin: 0 0 4px;
            letter-spacing: -.3px;
        }
        .modal-subtitle {
            font-size: 13px;
            color: #7a8fab;
            font-weight: 400;
            margin: 0;
        }

        /* ── INPUT GROUP ── */
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: #4a6080;
            margin-bottom: 7px;
        }
        .input-with-icon {
            position: relative;
        }
        .input-with-icon input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            border: 1.5px solid #d4e1f4;
            border-radius: 12px;
            font-size: 14.5px;
            font-family: 'Outfit', sans-serif;
            background: #fff;
            color: #1a2e4a;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            box-sizing: border-box;
        }
        .input-with-icon input:focus {
            border-color: #2e7de9;
            box-shadow: 0 0 0 3.5px rgba(46,125,233,.12);
        }
        .input-with-icon i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0b4cc;
            font-size: 15px;
            pointer-events: none;
        }

        /* ── OPTIONS ROW ── */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
            color: #5a7190;
        }
        .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .options a { color: #2e7de9; text-decoration: none; font-weight: 500; }
        .options a:hover { text-decoration: underline; }

        /* ── LOGIN BUTTON ── */
        .login-btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1b4f8a 0%, #2e7de9 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            letter-spacing: .4px;
            cursor: pointer;
            transition: transform .18s, box-shadow .18s;
            box-shadow: 0 6px 20px rgba(27,79,138,.30);
        }
        .login-btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(27,79,138,.38);
        }
        .login-btn-submit:active { transform: translateY(0); }

        /* ── REGISTER LINK ── */
        .register-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: #7a8fab;
        }
        .register-link a {
            color: #1b4f8a;
            font-weight: 700;
            text-decoration: none;
        }
        .register-link a:hover { text-decoration: underline; }


        /* ── DIVIDER ── */
        .modal-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #c5d5e8;
            font-size: 12px;
        }
        .modal-divider::before,
        .modal-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dde8f5;
        }
    </style>
</head>
<body class="home-page">

    <nav class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/uclogonav.png') }}" alt="UC Logo">
            <span>College of Computer Studies Sit-in Monitoring System</span>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="modern-nav-links" id="navbarLinks">
            <a href="/" class="nav-item"><i class="fas fa-home"></i> Home</a>
            <a href="/community" class="nav-item"><i class="fas fa-users"></i> Community</a>
            <a href="/leaderboard" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
            <a href="/about" class="nav-item"><i class="fas fa-info-circle"></i> About</a>
            <a href="#" id="openLogin" class="nav-login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
        </div>
    </nav>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="container">
        <div class="hero-content">
            
            <div class="hero-text">
                <h1>Welcome to CSS<br>Sit-in Monitoring System</h1>
                <p>Efficiently monitor and manage student laboratory sessions.</p>
                <button class="hero-btn" id="getStartedBtn">Get Started</button>
            </div>

            <div class="hero-image">
                <img src="{{ url_for('static', filename='images/ucmainccslogo.png') }}" alt="CCS Logo">
            </div>
            
        </div>
    </div>

    </section>

    <!-- ── LOGIN MODAL ── -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>

            <div class="modal-header-wrap">
                <div class="modal-icon-ring">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2>Welcome Back</h2>
                <p class="modal-subtitle">Sign in to your CCS account</p>
            </div>
            
            <form action="/login" method="POST" autocomplete="off">
                <div class="input-group">
                    <label>ID Number</label>
                    <div class="input-with-icon">
                        <input type="text" name="id_number" placeholder="e.g. 2021-12345 or ADMIN-001" required autocomplete="username">
                        <i class="fas fa-id-badge"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <i class="fas fa-eye" id="toggleLoginPw" style="pointer-events:all; cursor:pointer;"></i>
                    </div>
                </div>

                <div class="options">
                    <label><input type="checkbox" name="remember"> Remember me</label>
                    <a href="/forgot_password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn-submit">
                    <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Login
                </button>
                
                <p class="register-link">Don't have an account? <a href="/register">Register here</a></p>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // ── Open / Close Login Modal ──
        const modal      = document.getElementById('loginModal');
        const openBtn    = document.getElementById('openLogin');
        const getStarted = document.getElementById('getStartedBtn');
        const closeBtn   = document.getElementById('closeModal');

        function openModal()  { modal.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); }

        openBtn.addEventListener('click', e => { e.preventDefault(); openModal(); });
        getStarted.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); } });

        if (new URLSearchParams(location.search).get('openLogin') === 'true') openModal();

        // ── Password toggle ──
        const loginPw       = document.getElementById('loginPassword');
        const toggleLoginPw = document.getElementById('toggleLoginPw');
        toggleLoginPw.addEventListener('click', () => {
            const show = loginPw.type === 'password';
            loginPw.type = show ? 'text' : 'password';
            toggleLoginPw.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // ── Sidebar menu toggle ──
        const menuToggle = document.getElementById('menuToggle');
        const navbarLinks = document.getElementById('navbarLinks');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');

        function closeSidebar() {
            menuToggle.classList.remove('open');
            navbarLinks.classList.remove('active');
            sidebarBackdrop.classList.remove('active');
        }

        function openSidebar() {
            menuToggle.classList.add('open');
            navbarLinks.classList.add('active');
            sidebarBackdrop.classList.add('active');
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = menuToggle.classList.toggle('open');
            navbarLinks.classList.toggle('active', isOpen);
            sidebarBackdrop.classList.toggle('active', isOpen);
        });

        sidebarBackdrop.addEventListener('click', closeSidebar);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
        });
    </script>


    <div id="toastBox"></div>
</body>
</html>
